name: Testes e executável Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: PyInstaller
        run: pyinstaller --noconfirm framework_lora.spec
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: FrameworkLoRa-windows
          path: dist/FrameworkLoRa.exe
          if-no-files-found: error
      - name: Anexar ao release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FrameworkLoRa.exe
